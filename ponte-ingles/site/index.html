<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E58F0"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ponte"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Ponte English</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: app de uma coluna (máx. 880px) com cabeçalho fixo, abas no topo no desktop e barra inferior no celular. Visual "cartão de embarque": cobalto + amarelo sinal. */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --surface-2:#E9EDF6; --ink:#131C33; --muted:#5A6580; --line:#D8DEEA;
  --accent:#1E58F0; --accent-ink:#FFFFFF; --accent-soft:#E2E9FF; --sun:#FFB300; --sun-soft:#FFF1CC;
  --ok:#10916A; --ok-soft:#DDF4EC; --bad:#CF3F37; --bad-soft:#FBE3E1;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px; --shadow:0 1px 2px rgb(19 28 51 / .06), 0 6px 20px rgb(19 28 51 / .06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1222; --surface:#151D33; --surface-2:#1C2640; --ink:#E8ECF6; --muted:#97A2BC; --line:#28324D;
  --accent:#7097FF; --accent-ink:#0C1222; --accent-soft:#1E2B52; --sun:#FFC845; --sun-soft:#3A3115;
  --ok:#3BCB96; --ok-soft:#123327; --bad:#FF7B70; --bad-soft:#3A1A1A; --shadow:0 1px 2px rgb(0 0 0 / .3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1222; --surface:#151D33; --surface-2:#1C2640; --ink:#E8ECF6; --muted:#97A2BC; --line:#28324D;
  --accent:#7097FF; --accent-ink:#0C1222; --accent-soft:#1E2B52; --sun:#FFC845; --sun-soft:#3A3115;
  --ok:#3BCB96; --ok-soft:#123327; --bad:#FF7B70; --bad-soft:#3A1A1A; --shadow:0 1px 2px rgb(0 0 0 / .3); color-scheme:dark}

html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box}
button,a,label,.flash{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,4vw,2.3rem);font-weight:800}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.label{font:700 .7rem/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:880px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand b{font:800 1.3rem/1 var(--f-display);letter-spacing:-.02em}
.brand small{display:block;font:500 .72rem/1.2 var(--f-body);color:var(--muted)}
.stat{display:flex;align-items:center;gap:6px;font:700 .9rem/1 var(--f-mono);padding:7px 10px;border-radius:99px;background:var(--surface-2)}
.stat svg{width:16px;height:16px}
.stat.streak{color:var(--ink)} .stat.streak svg{color:var(--sun)}
.tabs{max-width:880px;margin:0 auto;display:flex;gap:4px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tab{background:none;border:0;padding:10px 12px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;display:flex;gap:7px;align-items:center}
.tab svg{width:18px;height:18px}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .dot{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--sun);color:#131C33;font:700 .68rem/18px var(--f-mono);text-align:center}

main{max-width:880px;margin:0 auto;padding-block:22px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.view{display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}

.btn{border:0;border-radius:11px;padding:12px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .12s, filter .12s}
.btn:hover{filter:brightness(1.07)} .btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{padding:8px 12px;font-size:.88rem;border-radius:9px}
.btn svg{width:18px;height:18px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:38px;height:38px;display:inline-grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}

/* Boarding pass (week hero) */
.pass{display:grid;grid-template-columns:1fr auto;background:var(--accent);color:var(--accent-ink);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.pass-main{padding:22px 22px 20px;display:grid;gap:14px;min-width:0}
.pass .label{color:inherit;opacity:.8}
.pass-route{display:flex;align-items:center;gap:12px;font:800 2.2rem/1 var(--f-display)}
.pass-route .arrow{flex:1;height:2px;background:currentColor;opacity:.4;position:relative;min-width:30px}
.pass-route .arrow::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:8px solid currentColor}
.pass-meta{display:flex;gap:22px;flex-wrap:wrap}
.pass-meta div{display:grid;gap:4px}
.pass-meta b{font:700 1rem/1.2 var(--f-body)}
.pass-stub{border-left:2px dashed rgb(255 255 255 / .45);padding:22px 20px;display:grid;place-items:center;gap:6px;text-align:center;background:rgb(0 0 0 / .08)}
.pass-stub .big{font:800 2.6rem/1 var(--f-mono)}
.pass .btn{background:var(--sun);color:#131C33}
@media (max-width:560px){.pass{grid-template-columns:1fr}.pass-stub{border-left:0;border-top:2px dashed rgb(255 255 255 / .45);grid-template-columns:auto 1fr;justify-items:start;text-align:left;padding:14px 22px}.pass-stub .big{font-size:2rem}}

/* Mission list */
.mission{display:grid;gap:10px}
.task{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--surface-2)}
.check{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:var(--surface)}
.task.done .check{background:var(--ok);border-color:var(--ok);color:#fff}
.task.done .check svg{width:18px;height:18px}
.task small{color:var(--muted);display:block}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--sun) calc(var(--p)*1%), var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring>div{width:76px;height:76px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1.1}
.ring b{font:800 1.3rem var(--f-mono)}

/* Teacher */
.teacher{display:flex;gap:14px;align-items:flex-start}
.avatar{width:52px;height:52px;flex:none;border-radius:50%;background:var(--sun-soft);display:grid;place-items:center}
.avatar svg{width:44px;height:44px}
.quote{font-size:1.02rem}
.quote em{font-style:normal;font-weight:700;color:var(--accent)}

/* Plan */
.months{display:grid;gap:14px}
.month{display:grid;grid-template-columns:70px 1fr;gap:16px}
.month-h{display:grid;align-content:start;gap:4px}
.month-h b{font:800 1.6rem/1 var(--f-display)}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.wk{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px;background:var(--surface);text-align:left}
.wk .label{font-size:.62rem}
.wk span{font-weight:600;font-size:.9rem;line-height:1.3}
.wk.done{background:var(--ok-soft);border-color:transparent}
.wk.now{border:2px solid var(--accent);background:var(--accent-soft)}
.wk.later{opacity:.6}
.cefr{display:inline-block;font:700 .66rem/1 var(--f-mono);padding:4px 6px;border-radius:5px;background:var(--surface-2);color:var(--ink)}
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.pillar{display:grid;gap:6px;padding:14px;border-radius:12px;background:var(--surface-2)}
.pillar b{font-family:var(--f-display);font-size:1.02rem}
@media (max-width:560px){.month{grid-template-columns:1fr;gap:8px}.month-h{display:flex;gap:10px;align-items:baseline}}

/* Level chooser */
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.lvl{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;display:grid;gap:6px}
.lvl b{font:700 1.08rem/1.2 var(--f-display)}
.lvl small{color:var(--muted);line-height:1.35}
.lvl[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 14px;border-radius:8px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* Chat */
.chat{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:min(78vh,720px);height:min(calc(100dvh - 190px),720px);min-height:460px;padding:0;overflow:hidden}
.chat-top{display:flex;gap:10px;align-items:center}
.chat-top .avatar{width:42px;height:42px}.chat-top .avatar svg{width:36px;height:36px}
.chat>*{min-width:0}
.tg{display:inline-flex;gap:5px;align-items:center;flex:none}
@media (max-width:380px){.tg span{display:none}.tg{padding:8px}}.tg svg{width:15px;height:15px}
.chat-head{padding:14px 16px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.modes{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:.86rem;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.msgs{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.msg{max-width:min(560px,88%);padding:11px 14px;border-radius:14px;min-width:0;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .fix{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--sun-soft);font-size:.92rem}
.msg .fix .label{color:var(--ink);display:block;margin-bottom:5px}
.msg .tools{display:flex;gap:6px;margin-top:8px}
.msg.sys{align-self:center;background:none;color:var(--muted);font-size:.86rem;text-align:center}
.composer{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--surface)}
.quick{grid-column:1/-1;display:flex;gap:6px;overflow-x:auto}
.quick .chip{font-size:.8rem;padding:5px 10px}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--surface-2);border:1.5px solid transparent;border-radius:11px;padding:11px 13px;resize:none}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--accent)}

/* Player overlay */
.player{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.player-in{max-width:680px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.progress{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;flex:1}
.progress i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.flash{perspective:1000px;min-height:230px;cursor:pointer;border:0;background:none;padding:0;width:100%}
.flash-in{position:relative;height:230px;transition:transform .45s;transform-style:preserve-3d}
.flash.flip .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:grid;place-items:center;align-content:center;gap:10px;padding:20px;text-align:center;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg);background:var(--accent-soft)}
.face .word{font:800 clamp(1.6rem,5vw,2.2rem)/1.1 var(--f-display)}
.face .ex{color:var(--muted);font-style:italic}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;text-align:left;font-weight:600}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.tokens{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;border-radius:12px;background:var(--surface-2)}
.tokens.answer{background:var(--surface);border:2px dashed var(--line)}
.tok{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;font-weight:600;box-shadow:0 2px 0 var(--line)}
.feedback{padding:14px 16px;border-radius:12px;font-weight:500}
.feedback.ok{background:var(--ok-soft)} .feedback.no{background:var(--bad-soft)}
.feedback b{display:block;font-family:var(--f-display);font-size:1.05rem;margin-bottom:2px}
.tip{font-size:1.04rem;line-height:1.65}
.tip strong{color:var(--accent)}
.shadow-line{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--surface)}
.big-q{font:700 1.3rem/1.35 var(--f-display)}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--accent);text-align:center;color:var(--accent)}

/* Review */
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.box{padding:10px;border-radius:10px;background:var(--surface-2);text-align:center;display:grid;gap:2px}
.box b{font:800 1.3rem var(--f-mono)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.loading{display:flex;gap:10px;align-items:center;color:var(--muted)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;z-index:80;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:none;opacity:1}}

/* Mobile bottom nav */
@media (max-width:700px){
  .tabs{position:fixed;left:0;right:0;bottom:0;max-width:none;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;gap:0;padding-bottom:env(safe-area-inset-bottom,0px);z-index:30}
  .tab{flex-direction:column;gap:3px;font-size:.64rem;padding:9px 2px 10px;border-bottom:0;border-top:3px solid transparent;flex:1;position:relative}
  .tab[aria-selected="true"]{border-top-color:var(--accent)}
  .tab .dot{position:absolute;top:4px;right:calc(50% - 22px)}
  .brand small{display:none}
  .chat{height:calc(100vh - 150px);height:calc(100dvh - 146px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:380px;border-radius:12px}
  main{padding-block:12px 100px}
  .chat-head{padding:10px 12px;gap:8px}.msgs{padding:12px}.composer{padding:10px}
  .chat-top .sub{display:none}
  .typing .tabs{display:none}
  .typing main{padding-bottom:16px}
}
.said{display:flex;flex-wrap:wrap;gap:6px}
.w{padding:4px 8px;border-radius:7px;font-weight:600}
.w.hit{background:var(--ok-soft);color:var(--ink)} .w.miss{background:var(--bad-soft);color:var(--ink);text-decoration:underline wavy var(--bad)}
.sounds{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.sound{display:grid;gap:8px;padding:14px;border-radius:12px;background:var(--surface-2);align-content:start}
.sound b{font-family:var(--f-display);font-size:1.05rem}
.pairs{display:flex;flex-wrap:wrap;gap:6px}
.pair{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.pair svg{width:14px;height:14px;color:var(--accent)}
.timer{font:800 2.4rem/1 var(--f-mono);color:var(--accent)}
.hint{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--accent-soft);font-size:.92rem}
.hint svg{width:20px;height:20px;flex:none;color:var(--accent);margin-top:2px}
.ai-out{padding:14px;border-radius:12px;background:var(--surface-2);line-height:1.6}
.toggles{display:flex;gap:14px;flex-wrap:wrap;font-size:.86rem;color:var(--muted)}
.toggles label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.msg .reveal{border:1px dashed var(--line);background:var(--surface-2);border-radius:9px;padding:8px 12px;font-weight:600;width:100%}
@media (max-height:500px){.top{position:static}.chat{height:auto;min-height:0}.msgs{min-height:220px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg width="38" height="38" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2F6BFF"/><stop offset="1" stop-color="#1340C8"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#lg)"/><path d="M12 19a8 8 0 0 1 8-8h24a8 8 0 0 1 8 8v15a8 8 0 0 1-8 8H31l-9 8v-8h-2a8 8 0 0 1-8-8Z" fill="#fff"/><path d="M19 33c3.8-10 22.2-10 26 0" fill="none" stroke="#FFB300" stroke-width="3.8" stroke-linecap="round"/><path d="M24 33v-4M32 33v-6.8M40 33v-4" stroke="#1E58F0" stroke-width="2.8" stroke-linecap="round"/><path d="M17 34.6h30" stroke="#1E58F0" stroke-width="3" stroke-linecap="round"/></svg>
      <div><b>Ponte<span style="color:var(--sun)">.</span></b><small>Inglês fluente em 26 semanas</small></div>

function hk(t){ let h = 0x811c9dc5; for (let i=0;i<t.length;i++){ h ^= t.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8,'0'); }
let curAudio = null, warned = false;
function noSound(){ if (warned) return; warned = true; toast('Sem som? Tire o celular do modo silencioso e aumente o volume.'); }
function speak(text, rate=0.95){
  const t = cleanSpeech(text), h = hk(t);
  try { if (window.speechSynthesis && (speechSynthesis.speaking || speechSynthesis.pending)) speechSynthesis.cancel(); } catch(e){}
  if (curAudio){ try { curAudio.pause(); } catch(e){} curAudio = null; }
  if (AUDIO_KEYS.has(h)){
    const a = new Audio('audio/' + h + '.mp3');
    a.playbackRate = rate < 0.8 ? 0.72 : 1;
    curAudio = a;
    const p = a.play();
    if (p && p.catch) p.catch(err => { if (err && err.name === 'NotAllowedError') noSound(); else ttsSpeak(t, rate); });
    return;
  }
  ttsSpeak(t, rate);
}
function ttsSpeak(t, rate){
  const ss = window.speechSynthesis;
  if (!ss || typeof SpeechSynthesisUtterance === 'undefined'){ toast('Este aparelho não tem voz para textos novos. As frases das aulas têm áudio gravado.'); return; }
  try {
    const u = new SpeechSynthesisUtterance(t);
    const want = S.accent === 'uk' ? 'en-GB' : 'en-US';
    if (!voices.length) loadVoices();
    u.lang = want;
    const v = voices.find(v => v.lang.replace('_','-') === want && /natural|google|samantha|daniel|premium|enhanced/i.test(v.name)) || voices.find(v => v.lang.replace('_','-') === want) || voices[0];
    if (v) u.voice = v;
    u.rate = rate;
    let started = false;
    u.onstart = () => { started = true; };
    u.onerror = e => { if (!started && !['interrupted','canceled'].includes(e.error)) noSound(); };
    ss.speak(u);
    try { ss.resume(); } catch(e){}
    setTimeout(() => { if (!started && !ss.speaking) noSound(); }, 2500);
  } catch(e){ noSound(); }
}

function lessonPrompt(theme, cefr){
  return `You are Prof. Natan, an outstanding English teacher for Brazilian Portuguese speakers. Create one complete micro-lesson.
Theme: "${theme}". Student CEFR level: ${cefr}. Make vocabulary, grammar and sentences exactly right for ${cefr} (simple for A1, sophisticated for C1/C2).
Reply with ONLY one JSON object in this exact shape:
{"title":"short title in Portuguese","tip":"explanation in Brazilian Portuguese, 3-5 sentences, mark key English forms with **double asterisks**, include 2 short English examples",
"vocab":[["english word or chunk","tradução em português","natural example sentence in English"]] (exactly 8 items, useful high-frequency chunks),
"quiz":[{"t":"mc","q":"question (English sentence with ___ or a question in Portuguese)","o":["4 options"],"a":0,"why":"short reason in Portuguese"},
{"t":"fill","q":"English sentence with ___","o":["3 options"],"a":0,"why":"short reason in Portuguese"},
{"t":"order","pt":"Portuguese sentence","en":"its natural English translation without final punctuation, 4-9 words"}] (exactly 7 items: 3 mc, 2 fill, 2 order; vary the correct index "a"),
"shadow":["3 natural spoken sentences for listen-and-repeat practice"]}`;
}
function normalizeLesson(g, theme, lv){
  if (!g || !Array.isArray(g.vocab) || !Array.isArray(g.quiz)) throw {code:'invalid'};
  const vocab = g.vocab.filter(v => Array.isArray(v) && v[0] && v[1]).map(v => [String(v[0]), String(v[1]), String(v[2]||'')]).slice(0,10);
  const quiz = g.quiz.filter(q => q && (q.t==='order' ? q.en && q.pt : Array.isArray(q.o) && q.o.length>1 && Number.isInteger(q.a) && q.a < q.o.length)).slice(0,8)
    .map(q => q.t==='order' ? {t:'order', pt:String(q.pt), en:String(q.en).replace(/[.!?]$/,'')} : {t:q.t==='fill'?'fill':'mc', q:String(q.q), o:q.o.map(String), a:q.a, why:String(q.why||'')});
  if (vocab.length < 3 || quiz.length < 3) throw {code:'invalid'};
  return {id:'gen-'+Date.now(), lv, title:String(g.title||theme), tip:String(g.tip||''), vocab, quiz, shadow:(g.shadow||[]).map(String).slice(0,4)};
}

function runLesson(L, w){
  const P = $('#playerIn');
  const steps = [{k:'tip'}, ...L.vocab.map((v,i)=>({k:'card',i})), ...L.quiz.map((q,i)=>({k:'q',i})), {k:'shadow'}, {k:'end'}];
  let s = 0, right = 0, total = L.quiz.length;
  const next = () => { s++; draw(); };
  const draw = () => {
    const st = steps[s], prog = s/(steps.length-1);
    if (st.k === 'tip'){
      P.innerHTML = `${playerTop(prog)}<div class="card pop" style="display:grid;gap:16px">
        <div class="teacher"><div class="avatar">${NATAN}</div><div><span class="label">Prof. Natan explica</span><h2>${esc(L.title)}</h2></div></div>
        <p class="tip">${md(L.tip)}</p><button class="btn" id="nx">Entendi, vamos às palavras</button></div>`;
    } else if (st.k === 'card'){
      const v = L.vocab[st.i];
      P.innerHTML = `${playerTop(prog)}<div style="display:grid;gap:12px"><span class="label">Vocabulário ${st.i+1} de ${L.vocab.length} · toque para virar</span>
        <button class="flash" id="fc"><div class="flash-in">
          <div class="face"><span class="word">${esc(v[0])}</span><span class="ex">${esc(v[2])}</span></div>
          <div class="face back"><span class="word">${esc(v[1])}</span><span class="muted">${esc(v[0])}</span></div></div></button>
        <div class="row" style="justify-content:center">${sayBtns(v[0] + '. ' + v[2])}</div>
        <div class="rate" style="grid-template-columns:1fr 1fr"><button class="btn ghost" id="nk">Ainda não sei</button><button class="btn" id="kn">Já sei</button></div></div>`;
      $('#fc').onclick = () => $('#fc').classList.toggle('flip');
      speak(v[0]);
      const add = known => { const id = v[0].toLowerCase(); if (!S.cards[id]) S.cards[id] = {en:v[0], pt:v[1], ex:v[2], box: known?2:0, due: Date.now() + (known? 3*864e5 : 0)}; addXp(2); next(); };
      $('#nk').onclick = () => add(false); $('#kn').onclick = () => add(true);
      bindClose(); return;
    } else if (st.k === 'q'){
      drawQuestion(L.quiz[st.i], prog, ok => { if (ok){ right++; addXp(5); } }, next); return;
    } else if (st.k === 'shadow'){
      P.innerHTML = `${playerTop(prog)}<div class="card pop" style="display:grid;gap:14px">
        <span class="label">Shadowing · fale junto</span><h2>Ouça e repita em voz alta, no mesmo ritmo</h2>

        <button class="btn" id="nx">Repeti todas</button></div>`;
    } else {
      const pct = Math.round(right/total*100);
      const first = !day().lesson;
      day().lesson = true;
      const advanced = w === S.week && S.week < 26 && pct >= 60;
      if (advanced) S.week++;
      L.done = true; S.done[L.id] = pct; save(); addXp(first ? 50 : 20);
      P.innerHTML = `${playerTop(1)}<div class="card pop" style="display:grid;gap:14px;justify-items:center;text-align:center">
        <div class="avatar">${NATAN}</div><span class="label">Aula concluída · +${first?50:20} XP</span>
        <h1>${pct>=80?'Excellent work!':pct>=60?'Good job!':'Keep going!'}</h1>
        <p class="muted">Você acertou ${right} de ${total} exercícios (${pct}%). ${advanced ? 'Semana concluída! Você avançou no plano.' : pct<60 ? 'Faça a aula de novo para liberar a próxima semana (mínimo 60%).' : ''}</p>
        <p>As palavras novas já estão na sua revisão. Agora, pratique o tema conversando com o Prof. Natan.</p>
        <div class="row" style="justify-content:center"><button class="btn" id="toChat">Conversar sobre "${esc(L.title)}"</button><button class="btn ghost" id="fin">Voltar ao início</button></div></div>`;

      $('#toChat').onclick = () => { S.mode = 'aula'; S.chatTopic = L.title; S.chat = []; save(); $('#player').hidden = true; document.body.style.overflow=''; go('professor'); };
      bindClose(); return;
    }
    $('#nx').onclick = next; bindClose();
  };
  draw();
}

function drawQuestion(q, prog, onAnswer, next){
  const P = $('#playerIn');
  let body;
  if (q.t === 'order'){
    const words = q.en.split(' ');
    body = `<span class="label">Monte a frase em inglês</span><p class="big-q">${esc(q.pt)}</p>
      <div class="tokens answer" id="ans"></div><div class="tokens" id="pool">${shuffle(words.map((w,i)=>({w,i}))).map(o=>`<button class="tok" data-i="${o.i}">${esc(o.w)}</button>`).join('')}</div>
      <button class="btn" id="chk" disabled>Verificar</button>`;
  } else {
    body = `<span class="label">${q.t==='fill'?'Complete a frase':'Escolha a resposta'}</span><p class="big-q">${fillQ(q.q)}</p>
      <div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}</div>`;
  }
  P.innerHTML = `${playerTop(prog)}<div class="card pop" style="display:grid;gap:16px">${body}<div id="fb"></div></div>`;
  bindClose();
  const finish = (ok, html) => {
    onAnswer(ok);
    $('#fb').innerHTML = `<div class="feedback ${ok?'ok':'no'} pop"><b>${ok?'Correct!':'Quase!'}</b>${html}</div><button class="btn" id="nx" style="margin-top:12px;width:100%">Continuar</button>`;
    $('#nx').onclick = next; $('#nx').focus();
  };
  if (q.t === 'order'){
    const ans = $('#ans'), pool = $('#pool'), chk = $('#chk');
    const move = e => { const b = e.target.closest('.tok'); if (!b || chk.dataset.done) return; (b.parentNode === pool ? ans : pool).append(b); chk.disabled = !ans.children.length; };
    ans.onclick = move; pool.onclick = move;
    chk.onclick = () => {
      const got = [...ans.children].map(b=>b.textContent).join(' ');
      const ok = norm(got) === norm(q.en);
      chk.dataset.done = 1; chk.hidden = true; speak(q.en);
      finish(ok, ok ? `<span>${esc(q.en)}.</span>` : `<span>Resposta: <strong>${esc(q.en)}</strong>.</span>`);
    };
  } else {
    P.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const k = +b.dataset.k, ok = k === q.a;
      P.querySelectorAll('.opt').forEach((x,i) => { x.disabled = true; if (i===q.a) x.classList.add('right'); });
      if (!ok) b.classList.add('wrong');
      if (q.t === 'fill' || /___/.test(q.q)) speak(q.q.replace('___', q.o[q.a]));
      finish(ok, `<span>${md(q.why || '')}</span>`);
    });
  }
}

const opener = m => ({duvidas:'Oi! Pode me perguntar qualquer coisa sobre inglês: gramática, pronúncia, como dizer algo, diferença entre palavras. Escreva em português mesmo.\n\nExemplos: "Quando uso do e does?", "Como pronuncio *thought*?", "Como digo *estou com saudade*?"', livre:'Hi there! I\'m Natan, your English teacher. How was your day today?', entrevista:'Good morning, thanks for coming in today. Let\'s start: could you tell me a little about yourself?', restaurante:'Hi, welcome! Table for one? Here\'s the menu. Can I get you something to drink?', aeroporto:'Good afternoon! Can I see your passport, please? Where are you flying to today?', reuniao:'Okay, let\'s get started. So, how is your part of the project going? Are we still on track for Friday?', corrigir:'Send me any text in English, an email, a message, anything, and I\'ll make it sound natural.', aula:`Great job on the lesson! Let\'s practice "${S.chatTopic||'the lesson'}". Tell me something using what you just learned.`})[m];

function rules(){
  const lv = CEFR[cefrIdx(Math.min(S.week,25))];
  if (S.mode === 'duvidas') return `You are Prof. Natan, a warm and brilliant English teacher for a Brazilian Portuguese speaker (CEFR ${lv}) who wants to become fluent in 6 months. The student is asking questions about English.
Rules:
- Answer in Brazilian Portuguese, clear and practical, like a great teacher would explain it in person. Keep it short (up to ~150 words) unless the question needs more.
- Always give 2-3 short English examples, with **bold** on the key part.
- For pronunciation, give a Portuguese-friendly respelling (e.g. thought ≈ "thót", língua entre os dentes) and mark the stressed syllable in CAPS.
- If the student wrote something in English with mistakes, add a line with only "---" and then "Correções:" listing ✗ wrong → ✓ right.
- End by inviting them to try using it in a sentence. Never use markdown headings.`;
  return `You are Prof. Natan, a warm, charismatic and very effective English teacher for a Brazilian Portuguese speaker who wants to become fluent in 6 months. Student level: ${lv} (CEFR).
Scenario: ${MODES[S.mode].s}${S.mode==='aula'?' Lesson topic: '+(S.chatTopic||''):''}
Rules:
- Reply in English adapted to ${lv}: ${['A1','A2'].includes(lv)?'very short and simple sentences, common words':'natural, varied English'}. 2 to 5 sentences. Stay in character and always end with one question that keeps the conversation going.
- If the student writes in Portuguese, answer the question briefly, then help them say it in English.
- After your reply, if the student's last message had any mistakes or unnatural phrasing, add a line with only "---" and then a section in Brazilian Portuguese starting with "Correções:" listing each fix as: ✗ wrong → ✓ right (motivo curto). Also suggest one more natural way to say their sentence when useful. If there were no mistakes, write "---" then "Correções: perfeito! 👏" plus one tip to sound more natural.
- Never use markdown headings. Use **bold** only for the corrected words.`;
}
function bubble(m){
  if (m.role === 'user') return `<div class="msg me">${esc(m.content)}</div>`;
  const [main, fix] = m.content.split(/\n\s*---\s*\n?/);
  const hide = S.listen && S.mode !== 'duvidas';
  return `<div class="msg bot">${hide ? `<button class="reveal" onclick="this.outerHTML=botText(decodeURIComponent('${encodeURIComponent(main).replace(/'/g,'%27')}'))">Treino de escuta: ouça e toque para ver o texto</button>` : md(main.trim())}${fix ? `<div class="fix"><span class="label">Correções</span>${md(fix.replace(/^\s*Corre[çc][õo]es:\s*/i,'').trim())}</div>` : ''}
    <div class="tools">${sayBtns(main.trim())}</div></div>`;
}
let chatCtl = null;
function botText(main){ return md(main.trim()); }

async function send(){
  const ci = $('#ci'), text = ci.value.trim(); if (!text || !sample || chatCtl) return;
  ci.value = '';
  S.chat.push({role:'user', content:text}); save();
  const msgs = $('#msgs');
  msgs.insertAdjacentHTML('beforeend', bubble({role:'user',content:text}) + '<div class="msg bot" id="live"><div class="loading"><span class="spin"></span>Prof. Natan está digitando...</div></div>');
  msgs.scrollTop = msgs.scrollHeight;
  const live = $('#live'); chatCtl = new AbortController(); $('#cs').disabled = true;
  const turns = S.chat.slice(-16); if (turns[0].role !== 'user') turns.unshift({role:'user', content:'(início da conversa)'});
  try {
    const {text: reply} = await sample([{role:'user', content:rules()}, ...turns], {cache:false, modelTier:'default', signal:chatCtl.signal,
      onText: ({text}) => { live.innerHTML = (S.listen && S.mode !== 'duvidas') ? '<div class="loading"><span class="spin"></span>Ouça a resposta...</div>' : md(text.split(/\n\s*---/)[0]); msgs.scrollTop = msgs.scrollHeight; }});
    S.chat.push({role:'assistant', content:reply}); S.chat = S.chat.slice(-40);
    day().chat++; addXp(3); save();
    live.outerHTML = bubble({role:'assistant', content:reply});
    if ((S.voice || S.listen) && S.mode !== 'duvidas') speak(reply.split(/\n\s*---/)[0]);
    msgs.scrollTop = msgs.scrollHeight;
  } catch(e){
    live.className = 'msg sys'; live.textContent = errMsg(e);
    S.chat.pop(); save();
  } finally { chatCtl = null; const b = $('#cs'); if (b) b.disabled = false; }
}

const CONTR = {"i'm":'i am',"you're":'you are',"we're":'we are',"they're":'they are',"he's":'he is',"she's":'she is',"it's":'it is',"that's":'that is',"what's":'what is',"isn't":'is not',"aren't":'are not',"don't":'do not',"doesn't":'does not',"didn't":'did not',"can't":'can not',"cannot":'can not',"won't":'will not',"i'd":'i would',"you'd":'you would',"we'd":'we would',"i've":'i have',"we've":'we have',"haven't":'have not',"hasn't":'has not',"i'll":'i will',"you'll":'you will',"we'll":'we will',"let's":'let us',"wouldn't":'would not',"wasn't":'was not',"weren't":'were not'};
const toks = t => norm(t.replace(/[’‘]/g,"'")).split(' ').filter(Boolean).flatMap(w => (CONTR[w] || w).split(' '));
function matchWords(target, said){
  const a = toks(target), b = toks(said), n = a.length, m = b.length;
  const L = Array.from({length:n+1}, () => new Array(m+1).fill(0));
  for (let i=n-1;i>=0;i--) for (let j=m-1;j>=0;j--) L[i][j] = a[i]===b[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);
  const hit = new Array(n).fill(false); let i=0, j=0;
  while (i<n && j<m){ if (a[i]===b[j]){ hit[i]=true; i++; j++; } else if (L[i+1][j] >= L[i][j+1]) i++; else j++; }
  return {words:a, hit, score: n ? Math.round(hit.filter(Boolean).length / n * 100) : 0};
}
function speakPool(){
  const lv = Math.min(4, cefrIdx(Math.min(S.week,25)));
  const lib = LIB.filter(l => Math.abs(l.lv - lv) <= 1).flatMap(l => l.shadow);
  const gen = Object.values(S.gen).flatMap(l => l.shadow || []);
  return [...new Set([...gen, ...lib])];
}
let fz = {i:0, talk:null, timer:null, left:60};
function renderFalar(){
  const el = $('#view-falar');
  const pool = speakPool(); const target = pool[fz.i % pool.length];
  const lv = Math.min(4, cefrIdx(Math.min(S.week,25)));
  if (!fz.talk) fz.talk = TALKS[(lv<=1?0:lv<=3?4:8) + Math.floor(Math.random()*4)];
  const mic = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
  el.innerHTML = `
  <div class="card" style="display:grid;gap:14px">
    <div class="row" style="justify-content:space-between"><div><span class="label">Desafio de pronúncia</span><h2>Fale a frase e veja o que o celular entendeu</h2></div><span class="label">${day().speak||0} hoje</span></div>
    <div class="hint">${mic}<span><b>Como falar:</b> toque na caixa abaixo e use o <b>microfone do teclado</b> do celular (no Gboard e no iPhone fica no próprio teclado). No computador: <b>Windows + H</b> ou, no Mac, aperte <b>Fn</b> duas vezes. Se o teclado escrever certo, sua pronúncia foi entendida.</span></div>
    <div class="shadow-line" style="background:var(--surface-2)"><div class="row" style="flex-wrap:nowrap">${sayBtns(target)}</div><b class="big-q" style="min-width:0;font-size:1.15rem">${esc(target)}</b></div>
    <textarea id="said" rows="2" placeholder="Toque aqui e fale a frase pelo microfone do teclado"></textarea>
    <div class="row"><button class="btn" id="chkSay">Verificar minha fala</button><button class="btn ghost" id="nextSay">Outra frase</button></div>
    <div id="sayOut"></div>
  </div>
  <div class="card" style="display:grid;gap:14px">
    <div><span class="label">Speaking de 1 minuto</span><h2>${esc(fz.talk[0])}</h2><p class="muted">${esc(fz.talk[1])}</p></div>
    <p class="muted" style="font-size:.92rem">Fale sem parar por 1 minuto, em voz alta. Pode errar: o objetivo é não travar. Use o microfone do teclado para registrar o que você falou e peça feedback ao Prof. Natan.</p>
    <div class="row"><span class="timer" id="tm">${fz.left}s</span><button class="btn" id="tmGo">${fz.timer?'Parar':'Começar 1 minuto'}</button><button class="btn ghost sm" id="newTalk">Outro tema</button></div>
    <textarea id="talkTxt" rows="4" placeholder="O que você falou aparece aqui (microfone do teclado)"></textarea>
    <button class="btn line" id="talkFb" style="justify-self:start" ${sample?'':'disabled'}>${ICON.spark}Pedir feedback ao Prof. Natan</button>
    <div id="talkOut"></div>
  </div>
  <div class="card" style="display:grid;gap:14px">
    <div><span class="label">Treino de sons</span><h2>Os 8 sons que brasileiros mais erram</h2><p class="muted">Toque em cada palavra para ouvir. Repita em voz alta, exagerando o movimento da boca.</p></div>
    <div class="sounds">${SOUNDS.map(x=>`<div class="sound"><b>${x.t}</b><p class="muted" style="font-size:.9rem">${esc(x.d)}</p><div class="pairs">${x.w.map(w=>`<button class="pair" data-say="${w}" data-rate="0.8">${ICON.slow}${w}</button>`).join('')}</div></div>`).join('')}</div>
  </div>`;
  $('#nextSay').onclick = () => { fz.i++; renderFalar(); };
  $('#chkSay').onclick = async () => {
    const said = $('#said').value.trim();
    if (!said){ toast('Fale (ou escreva) a frase na caixa primeiro.'); return; }
    const r = matchWords(target, said);
    const missed = r.words.filter((w,i)=>!r.hit[i]);
    day().speak = (day().speak||0) + 1; addXp(r.score >= 80 ? 8 : 4);
    $('#sayOut').innerHTML = `<div class="feedback ${r.score>=80?'ok':'no'} pop" style="display:grid;gap:10px"><b>${r.score>=95?'Perfect pronunciation!':r.score>=80?'Very good!':r.score>=50?'Quase lá!':'Vamos treinar mais'} · ${r.score}%</b>
      <div class="said">${r.words.map((w,i)=>`<span class="w ${r.hit[i]?'hit':'miss'}">${esc(w)}</span>`).join('')}</div>
      ${missed.length ? `<span>As palavras sublinhadas não foram entendidas. Ouça devagar e tente de novo.</span>` : ''}
      ${missed.length && sample ? `<button class="btn sm" id="howSay" style="justify-self:start">${ICON.spark}Como pronunciar essas palavras?</button>` : ''}<div id="howOut"></div></div>`;
    const hb = $('#howSay'); if (hb) hb.onclick = async () => {
      hb.disabled = true; $('#howOut').innerHTML = '<div class="loading"><span class="spin"></span>O Prof. Natan está analisando...</div>';
      try {
        const {text} = await sample(`You are Prof. Natan, an English pronunciation coach for Brazilian Portuguese speakers (CEFR ${CEFR[lv]}). The student tried to say: "${target}". Phone dictation heard: "${said}". Words not recognised: ${missed.join(', ')}.
In Brazilian Portuguese, for each missed word (max 4), give: a Portuguese-friendly respelling with the stressed syllable in CAPS, what Brazilians usually do wrong, and how to fix it (mouth/tongue position). Max 2 short lines per word, start each with the word in **bold**. Finish with one line suggesting how to practise. No headings.`, {modelTier:'quick'});
        $('#howOut').innerHTML = `<div class="ai-out pop">${md(text)}</div>`;
      } catch(e){ $('#howOut').innerHTML = `<p>${esc(errMsg(e))}</p>`; hb.disabled = false; }
    };
  };
  $('#newTalk').onclick = () => { fz.talk = null; renderFalar(); };
  $('#tmGo').onclick = () => {
    if (fz.timer){ clearInterval(fz.timer); fz.timer = null; fz.left = 60; renderFalarKeep(); return; }
    fz.left = 60; $('#tmGo').textContent = 'Parar'; $('#talkTxt').focus();
    fz.timer = setInterval(() => {
      fz.left--; const t = $('#tm'); if (t) t.textContent = fz.left + 's';
      if (fz.left <= 0){ clearInterval(fz.timer); fz.timer = null; fz.left = 60; toast('Tempo! Agora peça feedback ao professor.'); day().speak = (day().speak||0)+1; addXp(10); const b = $('#tmGo'); if (b) b.textContent = 'Começar 1 minuto'; }
    }, 1000);
  };
  $('#talkFb').onclick = async () => {
    const txt = $('#talkTxt').value.trim(); if (!txt){ toast('Fale ou escreva o que você disse na caixa primeiro.'); return; }
    const b = $('#talkFb'); b.disabled = true; $('#talkOut').innerHTML = '<div class="loading"><span class="spin"></span>O Prof. Natan está ouvindo sua fala...</div>';
    try {
      const {text} = await sample(`You are Prof. Natan, a warm and demanding English speaking coach for a Brazilian Portuguese speaker (CEFR ${CEFR[lv]}) aiming for fluency in 6 months.
The student spoke for about one minute about: "${fz.talk[0]}". Keyboard dictation transcribed it as:
"""${txt.slice(0,3000)}"""
Dictation mistakes can reveal pronunciation problems: if a word looks wrongly transcribed, say which word they probably meant and how to pronounce it.
Reply in Brazilian Portuguese with these parts, each starting with a **bold label**: **Nota de fluência** (0-10 and one line why), **O que ficou bom**, **Correções** (✗ wrong → ✓ right, max 5), **Versão mais natural** (a short improved version in English), **Pronúncia** (only if relevant), **Próximo passo** (one concrete exercise). Be concise.`, {modelTier:'default'});
      $('#talkOut').innerHTML = `<div class="ai-out pop">${md(text)}</div>`; addXp(10);
    } catch(e){ $('#talkOut').innerHTML = `<p>${esc(errMsg(e))}</p>`; }
    b.disabled = false;
  };
}
function renderFalarKeep(){ const a = $('#said')?.value, b = $('#talkTxt')?.value; renderFalar(); if (a) $('#said').value = a; if (b) $('#talkTxt').value = b; }

/* ============ REVISÃO (Leitner) ============ */
const INTERVAL = [0, 1, 3, 7, 16, 35]; // dias por caixa
let revQueue = null, revIdx = 0;
function renderRevisao(){
  const el = $('#view-revisao');
  const all = Object.values(S.cards), due = dueCards();
  const counts = [0,0,0,0,0]; all.forEach(c => counts[Math.min(4,c.box)]++);
  if (!all.length){
    el.innerHTML = `<div class="card" style="display:grid;gap:10px"><h2>Sua revisão começa na primeira aula</h2><p class="muted">Cada palavra que você estuda entra aqui. O app mostra cada uma de novo no momento certo: 1 dia, 3 dias, 1 semana, 2 semanas, 1 mês.</p><button class="btn" style="justify-self:start" onclick="go('hoje')">Ir para a aula</button></div>`; return;
  }
  if (!revQueue || revIdx >= revQueue.length){ revQueue = shuffle(due.map(([k])=>k)); revIdx = 0; }
  const head = `<div class="card" style="display:grid;gap:14px"><div class="row" style="justify-content:space-between"><h2>Revisão espaçada</h2><span class="label">${all.length} palavras no total</span></div>
    <div class="boxes">${['Nova','1 dia','3 dias','1 sem','Dominada'].map((n,i)=>`<div class="box"><b>${counts[i]}</b><span class="label" style="font-size:.58rem">${n}</span></div>`).join('')}</div></div>`;
  if (!revQueue.length){
    const next = Math.min(...all.map(c=>c.due));
    el.innerHTML = head + `<div class="card pop" style="display:grid;gap:8px;text-align:center;justify-items:center"><div class="avatar">${NATAN}</div><h2>Tudo revisado!</h2><p class="muted">Próxima revisão ${new Date(next).toLocaleDateString('pt-BR',{weekday:'long', day:'numeric'})}. Aproveite para conversar com o professor.</p></div>`;
    return;
  }
  const id = revQueue[revIdx], c = S.cards[id];
  el.innerHTML = head + `<div style="display:grid;gap:12px"><span class="label">Cartão ${revIdx+1} de ${revQueue.length} · lembre o significado e toque para conferir</span>
    <button class="flash" id="rf"><div class="flash-in"><div class="face"><span class="word">${esc(c.en)}</span><span class="ex">${esc(c.ex)}</span></div>
    <div class="face back"><span class="word">${esc(c.pt)}</span><span class="muted">${esc(c.en)}</span></div></div></button>
    <div class="row" style="justify-content:center">${sayBtns(c.en + '. ' + c.ex)}</div>
    <div class="rate"><button class="btn ghost" data-r="0">Errei</button><button class="btn ghost" data-r="1">Difícil</button><button class="btn" data-r="2">Fácil</button></div></div>`;
  $('#rf').onclick = () => $('#rf').classList.toggle('flip');
  el.querySelectorAll('[data-r]').forEach(b => b.onclick = () => {
    const r = +b.dataset.r;
    c.box = r === 0 ? 0 : Math.min(5, c.box + r);
    c.due = r === 0 ? Date.now() + 10*60e3 : Date.now() + INTERVAL[c.box]*864e5;
    day().review++; addXp(2); revIdx++; save(); renderRevisao();
  });
}

/* ============ PERFIL / NÍVEL ============ */
function renderPerfil(){
  const el = $('#view-perfil');
  const words = Object.keys(S.cards).length, mastered = Object.values(S.cards).filter(c=>c.box>=4).length;
  const days = Object.keys(S.daily).filter(d => S.daily[d].xp > 0).length;
  el.innerHTML = `
  <div class="card" style="display:grid;gap:14px"><h2>Seu progresso</h2>
    <div class="boxes" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">
      <div class="box"><b>${S.xp}</b><span class="label">XP total</span></div><div class="box"><b>${S.streak}</b><span class="label">dias seguidos</span></div>
      <div class="box"><b>${words}</b><span class="label">palavras</span></div><div class="box"><b>${mastered}</b><span class="label">dominadas</span></div>
      <div class="box"><b>${days}</b><span class="label">dias estudados</span></div></div></div>
  <div class="card" style="display:grid;gap:12px"><h2>Mudar de nível</h2><p class="muted">Seu plano é refeito a partir do nível escolhido. Suas palavras e XP continuam.</p>
    <div class="levels">${LEVELS.map((l,i)=>`<button class="lvl" data-lv="${i}" aria-pressed="${S.level===i}"><span class="cefr">${CEFR[i]}</span><b>${l.name}</b><small>${l.sub}</small></button>`).join('')}</div>
    <button class="btn line sm" id="retest" style="justify-self:start">Refazer teste de nivelamento</button></div>
  <div class="card" style="display:grid;gap:14px"><h2>Preferências</h2>
    <div style="display:grid;gap:8px"><span class="label">Sotaque da voz</span><div class="seg"><button data-acc="us" aria-pressed="${S.accent==='us'}">Americano</button><button data-acc="uk" aria-pressed="${S.accent==='uk'}">Britânico</button></div></div>
    <div style="display:grid;gap:8px"><span class="label">Tempo por dia</span><div class="seg">${[10,20,30,45].map(m=>`<button data-min="${m}" aria-pressed="${S.minutes===m}">${m} min</button>`).join('')}</div></div>
    <div style="display:grid;gap:8px"><span class="label">Biblioteca de aulas prontas</span><div class="row">${LIB.map(l=>`<button class="chip" data-lib="${l.id}">${CEFR[l.lv]} · ${esc(l.title)}</button>`).join('')}</div></div>
    <div><button class="btn line sm" id="reset">Recomeçar do zero</button><div id="resetConf" hidden style="margin-top:10px" class="row"><span>Apagar todo o progresso?</span><button class="btn sm" id="resetYes" style="background:var(--bad);color:#fff">Sim, apagar</button><button class="btn sm ghost" id="resetNo">Cancelar</button></div></div>
  </div>`;
  el.querySelectorAll('[data-lv]').forEach(b => b.onclick = () => { S.level = +b.dataset.lv; S.week = 0; S.start = today(); save(); toast('Nível atualizado. Plano refeito.'); renderPerfil(); });
  el.querySelectorAll('[data-acc]').forEach(b => b.onclick = () => { S.accent = b.dataset.acc; save(); renderPerfil(); speak('Hello! This is my accent.'); });
  el.querySelectorAll('[data-min]').forEach(b => b.onclick = () => { S.minutes = +b.dataset.min; save(); renderPerfil(); });
  el.querySelectorAll('[data-lib]').forEach(b => b.onclick = () => { $('#player').hidden = false; document.body.style.overflow='hidden'; runLesson(LIB.find(l=>l.id===b.dataset.lib), -1); });
  $('#retest').onclick = () => startPlacement(lv => { S.level = lv; S.week = 0; S.start = today(); save(); toast('Nível atualizado. Plano refeito.'); go('perfil'); });
  $('#reset').onclick = () => $('#resetConf').hidden = false;
  $('#resetNo').onclick = () => $('#resetConf').hidden = true;
  $('#resetYes').onclick = () => { S = defaults(); pickLv = null; save(); renderHeader(); go('hoje'); };
}
document.addEventListener('focusin', e => { if (e.target.matches('textarea,input[type=text]')) document.body.classList.add('typing'); });
document.addEventListener('focusout', () => setTimeout(() => { if (!document.activeElement?.matches('textarea,input[type=text]')) document.body.classList.remove('typing'); }, 50));
renderHeader(); go('hoje');
</script>
</body></html>
