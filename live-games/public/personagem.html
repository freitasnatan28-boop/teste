<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ARENIX · Personagem</title>
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ARENIX Personagem">
  <meta name="theme-color" content="#050807">
  <link rel="icon" href="/marca/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/marca/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/personagem.css">
</head>
<body class="cen-neon">
  <div id="palco">
    <div class="cenario" aria-hidden="true"><i class="c1"></i><i class="c2"></i><i class="c3"></i></div>

    <!-- pergunta da vez -->
    <section class="pergunta" id="pergunta">
      <div class="p-av" id="pAv"></div>
      <div class="p-corpo">
        <div class="p-topo"><b id="pNome">Me pergunte qualquer coisa!</b><span id="pSelo" class="p-selo" hidden></span></div>
        <div class="p-texto" id="pTexto">Escreva sua pergunta no chat 💬</div>
      </div>
    </section>

    <!-- meta de curtidas e apoiadores -->
    <aside class="lado esq">
      <div class="meta">
        <small>META DE<br>CURTIDAS</small>
        <div class="termo"><div class="termo-fill" id="metaFill"></div></div>
        <b id="metaAtual">0</b>
        <span id="metaAlvo">/ 500</span>
      </div>
      <ol class="top" id="top"></ol>
    </aside>

    <!-- presentes -->
    <aside class="lado dir" id="cartoes">
      <div class="cartao c-prioridade"><span class="ic">🌹</span><b>ME RESPONDA PRIMEIRO</b><small id="cPrioridade">1 moeda</small></div>
      <div class="cartao c-salve"><span class="ic">📣</span><b>GANHE UM SALVE</b><small id="cSalve">5 moedas</small></div>
      <div class="cartao c-foto"><span class="ic">📸</span><b>JULGO SUA FOTO</b><small id="cFoto">30 moedas</small></div>
    </aside>

    <!-- personagem -->
    <div class="personagem" id="personagem">
      <div class="corpo-anim" id="corpoAnim">
        <svg id="nix" class="nix" viewBox="0 0 600 700" aria-label="Nix, mascote da ARENIX">
          <defs>
            <linearGradient id="nx-corpo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4dffa0"/><stop offset="1" stop-color="#11b863"/></linearGradient>
            <linearGradient id="nx-borda" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d4ff3a"/><stop offset="1" stop-color="#0d8f4c"/></linearGradient>
            <radialGradient id="nx-olho"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#eaff9a"/><stop offset="1" stop-color="#b6ff2e"/></radialGradient>
            <filter id="nx-brilho" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <ellipse cx="300" cy="672" rx="170" ry="20" fill="rgba(0,0,0,.45)"/>
          <!-- pés -->
          <rect x="215" y="600" width="70" height="60" rx="24" fill="#0e9c55"/>
          <rect x="315" y="600" width="70" height="60" rx="24" fill="#0e9c55"/>
          <!-- braços -->
          <g class="braco esq-b"><rect x="118" y="452" width="56" height="130" rx="28" fill="url(#nx-corpo)" stroke="url(#nx-borda)" stroke-width="4"/><circle cx="146" cy="590" r="30" fill="#d4ff3a"/></g>
          <g class="braco dir-b"><rect x="426" y="452" width="56" height="130" rx="28" fill="url(#nx-corpo)" stroke="url(#nx-borda)" stroke-width="4"/><circle cx="454" cy="590" r="30" fill="#d4ff3a"/></g>
          <!-- corpo -->
          <rect x="175" y="420" width="250" height="200" rx="70" fill="url(#nx-corpo)" stroke="url(#nx-borda)" stroke-width="5"/>
          <rect x="235" y="470" width="130" height="90" rx="28" fill="#06120c"/>
          <path class="peito" d="M272 535 300 490l28 45" fill="none" stroke="#2bff88" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#nx-brilho)"/>
          <!-- antena -->
          <line x1="300" y1="118" x2="300" y2="62" stroke="#0e9c55" stroke-width="12" stroke-linecap="round"/>
          <circle class="antena" cx="300" cy="48" r="20" fill="#d4ff3a" filter="url(#nx-brilho)"/>
          <!-- cabeça -->
          <rect x="95" y="110" width="410" height="330" rx="120" fill="url(#nx-corpo)" stroke="url(#nx-borda)" stroke-width="6"/>
          <rect x="70" y="230" width="40" height="90" rx="18" fill="#0e9c55"/>
          <rect x="490" y="230" width="40" height="90" rx="18" fill="#0e9c55"/>
          <rect x="140" y="160" width="320" height="230" rx="90" fill="#06120c"/>
          <rect x="160" y="172" width="150" height="26" rx="13" fill="rgba(255,255,255,.07)"/>
          <!-- olhos -->
          <g class="olhos" filter="url(#nx-brilho)">
            <ellipse cx="232" cy="262" rx="36" ry="46" fill="url(#nx-olho)"/>
            <ellipse cx="368" cy="262" rx="36" ry="46" fill="url(#nx-olho)"/>
            <circle cx="244" cy="246" r="9" fill="#fff"/>
            <circle cx="380" cy="246" r="9" fill="#fff"/>
          </g>
          <ellipse cx="190" cy="330" rx="22" ry="12" fill="rgba(255,110,160,.55)"/>
          <ellipse cx="410" cy="330" rx="22" ry="12" fill="rgba(255,110,160,.55)"/>
          <!-- boca: abre conforme o volume da voz -->
          <g transform="translate(300 344)"><g id="boca" class="boca"><rect x="-48" y="-14" width="96" height="28" rx="14" fill="#d4ff3a" filter="url(#nx-brilho)"/><rect x="-30" y="-6" width="60" height="12" rx="6" fill="#ff5c8a" opacity=".85"/></g></g>
        </svg>
        <img id="imgPersonagem" class="img-personagem" alt="" hidden>
      </div>
      <div class="pensando" id="pensando" hidden><i></i><i></i><i></i></div>
      <div class="nome-tag" id="nomeTag">NIX</div>
    </div>

    <!-- legenda da fala -->
    <section class="legenda" id="legenda" hidden><p id="legendaTexto"></p></section>

    <div class="rodape">
      <span class="pill" id="fila">💬 Me pergunte qualquer coisa no chat!</span>
      <span class="marca"><img src="/marca/simbolo.svg" alt="">ARENI<em>X</em></span>
    </div>

    <div id="toasts" class="toasts"></div>
    <button id="ativarSom" class="ativar-som" hidden>🔊 Toque para ativar a voz</button>
    <div id="avisoTela" class="aviso-tela">Este link da tela foi trocado.<br>Copie o link novo no painel.</div>
  </div>
  <script src="/personagem.js"></script>
</body>
</html>
