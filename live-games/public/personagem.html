<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ARENIX · Personagem</title>
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ARENIX Personagem">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/marca/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/marca/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Unbounded:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/personagem.css">
</head>
<body>
  <div id="palco">
    <!-- cenário -->
    <div class="fundo" id="fundo"><video id="fundoVideo" muted loop playsinline hidden></video></div>
    <div class="placa" id="placa" hidden><span id="placaTexto"></span></div>

    <!-- personagem -->
    <div class="ator" id="ator">
      <div class="sombra"></div>
      <div class="ator-mov" id="atorMov">
        <div class="ator-fala" id="atorFala">
          <img class="quadro on" id="fParado" alt="">
          <img class="quadro" id="fMeio" alt="">
          <img class="quadro" id="fFalando" alt="">
          <img class="quadro" id="fPiscando" alt="">
          <video class="quadro" id="vParado" muted loop playsinline hidden></video>
          <video class="quadro" id="vFalando" muted loop playsinline hidden></video>
        </div>
      </div>
    </div>
    <div class="particulas" id="particulas" aria-hidden="true"></div>

    <!-- pergunta da vez -->
    <section class="pergunta" id="pergunta">
      <div class="p-av" id="pAv"></div>
      <div class="p-corpo">
        <div class="p-topo"><b id="pNome"></b><span id="pSelo" class="p-selo" hidden></span></div>
        <div class="p-texto" id="pTexto"></div>
      </div>
    </section>

    <!-- meta de curtidas e apoiadores -->
    <aside class="meta">
      <span class="meta-ic">❤️</span>
      <small>META DE<br>CURTIDAS</small>
      <div class="termo"><div class="termo-fill" id="metaFill"></div></div>
      <b id="metaAtual">0</b>
      <span id="metaAlvo">500</span>
    </aside>
    <ol class="top" id="top"></ol>

    <!-- adesivos de presente -->
    <aside class="adesivos">
      <div class="adesivo a1"><span class="ic">🌹</span><b>ME RESPONDA PRIMEIRO</b><small id="cPrioridade">1 moeda</small></div>
      <div class="adesivo a2"><span class="ic">📣</span><b>ME DÁ UM SALVE</b><small id="cSalve">5 moedas</small></div>
      <div class="adesivo a3"><span class="ic">📸</span><b>JULGA MINHA FOTO</b><small id="cFoto">30 moedas</small></div>
    </aside>

    <!-- legenda da fala -->
    <div class="legenda" id="legenda" hidden><p id="legendaTexto"></p></div>

    <div class="marca"><img src="/marca/simbolo.svg" alt="">ARENI<em>X</em></div>
    <div id="toasts" class="toasts"></div>
    <button id="ativarSom" class="ativar-som" hidden>🔊 Toque para ativar a voz</button>
    <div id="avisoTela" class="aviso-tela">Este link da tela foi trocado.<br>Copie o link novo no painel.</div>
  </div>
  <script src="/personagem.js"></script>
</body>
</html>
