<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="system-ui, sans-serif" role="img" aria-label="Diagram: front of a box with a round door 7 to 8 inches wide starting 2 inches above the floor, a side window, and the top flaps folded into a peaked roof">
  <rect width="760" height="380" fill="#fffdf8"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#2a211a">Front panel: door</text>
  <text x="420" y="34" font-size="20" font-weight="700" fill="#2a211a">Finished house</text>
  <g transform="translate(40 60)">
    <rect width="300" height="240" fill="#e2b783" stroke="#7a4f24" stroke-width="2.5"/>
    <circle cx="150" cy="140" r="56" fill="#fffdf8" stroke="#b4532a" stroke-width="3" stroke-dasharray="9 6"/>
    <path d="M94 140 h112" stroke="#2a211a" stroke-width="1.5"/>
    <text x="118" y="132" font-size="14" fill="#2a211a">7–8 in</text>
    <text x="118" y="164" font-size="13" fill="#6b5d50">(18–20 cm)</text>
    <path d="M150 196 v44" stroke="#2a211a" stroke-width="1.5"/>
    <text x="158" y="226" font-size="14" fill="#2a211a">≥ 2 in (5 cm) lip</text>
    <text x="0" y="272" font-size="15" fill="#6b5d50">Leave a lip at the bottom so bedding stays in</text>
    <text x="0" y="292" font-size="15" fill="#6b5d50">and the front panel keeps its strength.</text>
  </g>
  <g transform="translate(430 70)">
    <path d="M20 110 L150 30 L280 110 Z" fill="#cf9b5e" stroke="#7a4f24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M150 30 L150 110" stroke="#7a4f24" stroke-width="2"/>
    <rect x="30" y="110" width="240" height="170" fill="#e2b783" stroke="#7a4f24" stroke-width="2.5"/>
    <path d="M110 280 v-62 a40 40 0 0 1 80 0 v62" fill="#4a3a2c" stroke="#7a4f24" stroke-width="2.5"/>
    <rect x="200" y="140" width="46" height="40" rx="6" fill="#4a3a2c" stroke="#7a4f24" stroke-width="2.5"/>
    <rect x="50" y="140" width="46" height="40" rx="6" fill="#4a3a2c" stroke="#7a4f24" stroke-width="2.5"/>
    <text x="0" y="310" font-size="15" fill="#6b5d50">Top flaps taped into a roof. Windows give</text>
    <text x="0" y="330" font-size="15" fill="#6b5d50">a second view out, which many cats prefer.</text>
  </g>
</svg>
