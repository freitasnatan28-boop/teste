    <path d="M30 60 q22 -6 26 -26" fill="none" stroke="#5a3418" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- puzzle toy (toilet roll) -->
  <g transform="translate(262 262)">
    <rect x="-22" y="-14" width="44" height="28" rx="6" fill="#d9a86c" stroke="#7a4f24" stroke-width="3"/>
    <ellipse cx="22" cy="0" rx="5" ry="14" fill="#b07a40" stroke="#7a4f24" stroke-width="3"/>
    <circle cx="-6" cy="-2" r="4" fill="#7a4f24"/><circle cx="8" cy="4" r="3.5" fill="#7a4f24"/>
  </g>
  <!-- little hearts -->
  <path d="M372 92 c-6 -10 -20 -2 -12 8 l12 12 l12 -12 c8 -10 -6 -18 -12 -8z" fill="#e0785a"/>
  <path d="M84 68 c-4 -7 -14 -1 -8 5.5 l8 8 l8 -8 c6 -6.5 -4 -12.5 -8 -5.5z" fill="#e0785a"/>
