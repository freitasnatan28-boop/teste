<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" role="img" aria-label="A cat peeking out of a cardboard box next to a dog with a cardboard puzzle toy">
  <ellipse cx="210" cy="292" rx="190" ry="16" fill="#e8dcc8"/>
  <!-- box back flaps -->
  <path d="M60 150 L40 112 L130 104 L150 140 Z" fill="#d9a86c" stroke="#7a4f24" stroke-width="3" stroke-linejoin="round"/>
  <path d="M230 140 L252 100 L170 96 L150 140 Z" fill="#cf9b5e" stroke="#7a4f24" stroke-width="3" stroke-linejoin="round"/>
  <!-- cat head -->
  <g transform="translate(150 150)">
    <path d="M-48 -8 L-44 -62 L-16 -36 Z" fill="#f2a65a" stroke="#5a3418" stroke-width="3" stroke-linejoin="round"/>
    <path d="M48 -8 L44 -62 L16 -36 Z" fill="#f2a65a" stroke="#5a3418" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="0" cy="-10" rx="56" ry="44" fill="#f2a65a" stroke="#5a3418" stroke-width="3"/>
    <path d="M-40 -48 L-38 -34 M-30 -52 L-30 -40" stroke="#c46f2a" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="-20" cy="-14" rx="7" ry="9" fill="#2a211a"/><ellipse cx="20" cy="-14" rx="7" ry="9" fill="#2a211a"/>
    <circle cx="-18" cy="-17" r="2.4" fill="#fff"/><circle cx="22" cy="-17" r="2.4" fill="#fff"/>
    <path d="M-5 2 L5 2 L0 8 Z" fill="#b4532a"/>
    <path d="M0 8 Q-6 14 -12 11 M0 8 Q6 14 12 11" fill="none" stroke="#5a3418" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-30 4 L-62 -2 M-30 10 L-60 12 M30 4 L62 -2 M30 10 L60 12" stroke="#5a3418" stroke-width="2" stroke-linecap="round"/>
    <!-- paws on box edge -->
    <ellipse cx="-30" cy="0" rx="14" ry="9" fill="#f2a65a" stroke="#5a3418" stroke-width="3"/>
    <ellipse cx="30" cy="0" rx="14" ry="9" fill="#f2a65a" stroke="#5a3418" stroke-width="3"/>
  </g>
  <!-- box front -->
  <path d="M50 150 L250 150 L250 280 L50 280 Z" fill="#e2b783" stroke="#7a4f24" stroke-width="3" stroke-linejoin="round"/>
  <path d="M50 150 L30 196 L230 196 L250 150" fill="#d39f63" stroke="#7a4f24" stroke-width="3" stroke-linejoin="round"/>
  <path d="M110 236 h80" stroke="#b07a40" stroke-width="5" stroke-linecap="round"/>
  <path d="M120 252 h60" stroke="#b07a40" stroke-width="5" stroke-linecap="round"/>
  <!-- dog -->
  <g transform="translate(330 200)">
    <ellipse cx="0" cy="48" rx="44" ry="36" fill="#fff4e4" stroke="#5a3418" stroke-width="3"/>
    <ellipse cx="0" cy="-10" rx="38" ry="34" fill="#fff4e4" stroke="#5a3418" stroke-width="3"/>
    <path d="M-34 -24 Q-58 -6 -46 24 Q-34 20 -30 -2 Z" fill="#8a5a2f" stroke="#5a3418" stroke-width="3" stroke-linejoin="round"/>
    <path d="M34 -24 Q58 -6 46 24 Q34 20 30 -2 Z" fill="#8a5a2f" stroke="#5a3418" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="-13" cy="-14" r="5.5" fill="#2a211a"/><circle cx="13" cy="-14" r="5.5" fill="#2a211a"/>
    <circle cx="-11.5" cy="-16" r="1.8" fill="#fff"/><circle cx="14.5" cy="-16" r="1.8" fill="#fff"/>
    <ellipse cx="0" cy="4" rx="16" ry="12" fill="#f1dcc0" stroke="#5a3418" stroke-width="2.5"/>
    <ellipse cx="0" cy="-1" rx="6" ry="4.5" fill="#2a211a"/>
