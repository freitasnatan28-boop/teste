<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;font-family:Poppins,sans-serif;background:#0f3d2e;color:#fff}
.w{position:relative;width:1080px;height:1350px;padding:64px 64px;background:radial-gradient(circle at 75% 55%,#1f7a55 0,#0f3d2e 60%)}

.book{position:absolute;right:80px;top:470px;width:400px;height:540px;border-radius:6px 18px 18px 6px;background:linear-gradient(160deg,#c6f432,#7fc51d);transform:rotate(6deg);box-shadow:-18px 30px 60px rgba(0,0,0,.5),inset 14px 0 0 rgba(0,0,0,.18);color:#0f3d2e;padding:46px 40px 40px 52px;display:flex;flex-direction:column}

.book i{font-style:normal;font-weight:700;font-size:30px;line-height:1.2;margin-top:14px}
.book .ic{margin-top:auto;font-size:84px}
.list{position:absolute;left:64px;top:690px;font-size:32px;font-weight:700;line-height:1.9}
.list div::before{content:"✔";color:#c6f432;margin-right:14px}
.price{position:absolute;left:64px;bottom:200px}
.price s{font-size:34px;opacity:.6}
.price .v{font-family:Anton;font-size:150px;line-height:1;color:#c6f432}
.price .v small{font-size:60px}
.cta{position:absolute;left:64px;right:64px;bottom:64px;background:#ff5a1f;text-align:center;font-weight:900;font-size:46px;padding:28px;border-radius:24px;box-shadow:0 10px 0 #b8380b}

<div class="price"><s>De R$ 47,00</s><div class="v"><small>R$ </small>19,90</div></div>
<div class="cta">QUERO MEU E-BOOK AGORA →</div>
