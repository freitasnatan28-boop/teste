<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 640" role="img" aria-label="Taróloga com bola de cristal e cartas de tarô sob o céu estrelado">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b305c"/>
      <stop offset="1" stop-color="#0b1530"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe0b0" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffe0b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ball" cx="38%" cy="32%" r="72%">
      <stop offset="0" stop-color="#f6f9ff"/>
      <stop offset=".45" stop-color="#a9c6ec"/>
      <stop offset="1" stop-color="#36578c"/>
    </radialGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a3550"/>
      <stop offset="1" stop-color="#5b1e34"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24457a"/>
      <stop offset="1" stop-color="#132a50"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6ea"/>
      <stop offset="1" stop-color="#f1dcbc"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9b47a"/>
      <stop offset="1" stop-color="#a8592a"/>
    </linearGradient>

    <path id="crescent" d="M8 -18.33 A20 20 0 1 0 8 18.33 A19.3 19.3 0 0 1 8 -18.33Z"/>
    <symbol id="sp" viewBox="-10 -10 20 20"><path d="M0 -10 Q1.5 -1.5 10 0 Q1.5 1.5 0 10 Q-1.5 1.5 -10 0 Q-1.5 -1.5 0 -10Z"/></symbol>

    <g id="cardBase">
      <rect x="-42" y="-66" width="84" height="132" rx="8" fill="url(#card)" stroke="#b8682f" stroke-width="2.5"/>
      <rect x="-35" y="-59" width="70" height="118" rx="5" fill="none" stroke="#b8682f" stroke-width="1" opacity=".7"/>
      <path d="M-20 46 H20" stroke="#b8682f" stroke-width="1.5"/>
    </g>
    <g id="cardSun">
      <use href="#cardBase"/>
      <text x="0" y="-38" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#7a3e1b">XIX</text>
      <circle cx="0" cy="4" r="13" fill="#e2a668"/>
      <path transform="translate(0 4)" d="M0 -18V-26M0 18V26M-18 0H-26M18 0H26M12.7 -12.7L18.4 -18.4M-12.7 12.7L-18.4 18.4M12.7 12.7L18.4 18.4M-12.7 -12.7L-18.4 -18.4" stroke="#e2a668" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="cardMoon">
      <use href="#cardBase"/>
      <text x="0" y="-38" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#7a3e1b">XVIII</text>
      <use href="#crescent" transform="translate(0 4)" fill="#36578c"/>
      <use href="#sp" x="10" y="-16" width="10" height="10" fill="#b8682f"/>
    </g>
    <g id="cardLovers">
      <use href="#cardBase"/>
      <text x="0" y="-38" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#7a3e1b">VI</text>
      <path transform="translate(0 6)" d="M0 16 C-22 2 -20 -16 -8 -16 C-3 -16 0 -12 0 -9 C0 -12 3 -16 8 -16 C20 -16 22 2 0 16Z" fill="#a8455a"/>
    </g>
    <g id="cardBack">
      <rect x="-42" y="-66" width="84" height="132" rx="8" fill="#1f3a64" stroke="#e2a668" stroke-width="2.5"/>
      <rect x="-35" y="-59" width="70" height="118" rx="5" fill="none" stroke="#e2a668" stroke-width="1" opacity=".6"/>
      <use href="#crescent" transform="translate(0 -4) scale(.8)" fill="#e2a668"/>
      <use href="#sp" x="-6" y="28" width="12" height="12" fill="#e2a668"/>
      <use href="#sp" x="-6" y="-46" width="12" height="12" fill="#e2a668"/>
    </g>
    <g id="candle">
      <circle cx="0" cy="-74" r="36" fill="url(#glow)" opacity=".8"/>
      <rect x="-11" y="-58" width="22" height="58" rx="3" fill="#f4e6cf"/>
      <path d="M-11 -54 Q-11 -58 -7 -58 H7 Q11 -58 11 -54 V-44 Q8 -40 6 -46 Q4 -52 1 -44 Q-2 -38 -5 -48 Q-8 -54 -11 -48Z" fill="#fffaf0"/>
      <ellipse cx="0" cy="0" rx="20" ry="6" fill="url(#copper)"/>
      <path d="M0 -58 V-64" stroke="#3b2420" stroke-width="2"/>
      <path d="M0 -88 C8 -76 9 -68 0 -62 C-9 -68 -8 -76 0 -88Z" fill="#ffcf7a"/>
      <path d="M0 -78 C3 -72 3 -68 0 -65 C-3 -68 -3 -72 0 -78Z" fill="#fff3d6"/>
    </g>
  </defs>

  <!-- céu -->
  <rect width="800" height="640" fill="url(#sky)"/>
  <g fill="#fff">
    <circle cx="60" cy="60" r="1.8" opacity=".8"/>
    <circle cx="128" cy="150" r="1.3" opacity=".6"/>
    <circle cx="205" cy="78" r="2" opacity=".75"/>
    <circle cx="88" cy="300" r="1.4" opacity=".55"/>
    <circle cx="165" cy="232" r="1.8" opacity=".7"/>
    <circle cx="300" cy="46" r="1.4" opacity=".6"/>
    <circle cx="505" cy="38" r="1.8" opacity=".7"/>
    <circle cx="560" cy="120" r="1.2" opacity=".5"/>
    <circle cx="740" cy="210" r="1.6" opacity=".7"/>
    <circle cx="700" cy="280" r="1.2" opacity=".5"/>
    <circle cx="628" cy="340" r="1.7" opacity=".7"/>
    <circle cx="760" cy="410" r="1.3" opacity=".6"/>
    <circle cx="40" cy="420" r="1.6" opacity=".6"/>
    <circle cx="410" cy="22" r="1.2" opacity=".5"/>
  </g>
  <use href="#crescent" transform="translate(668 112) scale(2.6)" fill="#f3dcae"/>
  <circle cx="668" cy="112" r="80" fill="url(#glow)" opacity=".18"/>
  <use href="#sp" x="98" y="390" width="24" height="24" fill="#e2a668"/>
  <use href="#sp" x="680" y="320" width="18" height="18" fill="#e2a668"/>
  <use href="#sp" x="240" y="112" width="16" height="16" fill="#e2a668" opacity=".85"/>
  <use href="#sp" x="552" y="168" width="14" height="14" fill="#e2a668" opacity=".85"/>

  <!-- arco -->
  <path d="M210 640 V320 A190 190 0 0 1 590 320 V640Z" fill="#1d3562" opacity=".65"/>
  <path d="M210 640 V320 A190 190 0 0 1 590 320 V640" fill="none" stroke="#e2a668" stroke-width="2" opacity=".4"/>
  <path d="M226 640 V322 A174 174 0 0 1 574 322 V640" fill="none" stroke="#e2a668" stroke-width="1" opacity=".22"/>
  <circle cx="400" cy="240" r="150" fill="url(#glow)" opacity=".2"/>

  <!-- cabelo (atrás) -->
  <path d="M400 138 C328 138 310 200 314 262 C318 332 298 382 286 436 L514 436 C502 382 482 332 486 262 C490 200 472 138 400 138Z" fill="#3b2420"/>

  <!-- pescoço e colo -->
  <path d="M380 290 H420 V360 L440 366 L400 436 L360 366 L380 360Z" fill="#cf9472"/>

  <!-- manto -->
  <path d="M240 640 L250 470 C255 410 300 382 362 366 L400 432 L438 366 C500 382 545 410 550 470 L560 640Z" fill="url(#robe)"/>
  <path d="M300 640 C298 560 300 500 318 446 M500 640 C502 560 500 500 482 446" fill="none" stroke="#4a172a" stroke-width="3" opacity=".5"/>
  <path d="M362 366 L400 432 L438 366" fill="none" stroke="#e2a668" stroke-width="4" stroke-linejoin="round"/>
  <path d="M378 372 Q400 404 422 372" fill="none" stroke="#e2a668" stroke-width="2"/>
  <use href="#crescent" transform="translate(400 404) scale(.32)" fill="#e2a668"/>

  <!-- rosto -->
  <ellipse cx="400" cy="248" rx="57" ry="70" fill="#d9a07c"/>
  <ellipse cx="368" cy="284" rx="12" ry="7" fill="#e5847c" opacity=".35"/>
  <ellipse cx="432" cy="284" rx="12" ry="7" fill="#e5847c" opacity=".35"/>
  <g fill="none" stroke="#3b2420" stroke-linecap="round">
    <path d="M364 234 Q377 226 390 232" stroke-width="2.5"/>
    <path d="M410 232 Q423 226 436 234" stroke-width="2.5"/>
    <path d="M367 254 Q378 263 389 254" stroke-width="3"/>
    <path d="M411 254 Q422 263 433 254" stroke-width="3"/>
    <path d="M370 258 L367 262 M378 261 L377 266 M386 258 L388 262 M414 258 L412 262 M422 261 L423 266 M430 258 L433 262" stroke-width="1.6"/>
  </g>
  <path d="M400 260 Q395 280 403 284" fill="none" stroke="#b47a59" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M384 300 Q400 314 416 300 Q400 306 384 300Z" fill="#a8455a"/>

  <!-- cabelo (frente) -->
  <path d="M400 166 C350 166 334 206 338 252 C342 302 330 332 318 364 C350 344 354 302 354 262 C356 222 372 196 400 190 C428 196 444 222 446 262 C446 302 450 344 482 364 C470 332 458 302 462 252 C466 206 450 166 400 166Z" fill="#3b2420"/>

  <!-- tiara com lua -->
  <path d="M347 213 Q400 189 453 213" fill="none" stroke="#e2a668" stroke-width="4" stroke-linecap="round"/>
  <circle cx="400" cy="202" r="6" fill="#a9c6ec" stroke="#e2a668" stroke-width="2"/>
  <use href="#crescent" transform="translate(400 180) scale(.42)" fill="#e2a668"/>

  <!-- mesa -->
  <path d="M100 640 L150 478 H650 L700 640Z" fill="url(#cloth)"/>
  <path d="M150 478 H650" stroke="#e2a668" stroke-width="3"/>
  <g fill="#e2a668" opacity=".18">
    <use href="#sp" x="180" y="600" width="18" height="18"/>
    <use href="#sp" x="610" y="604" width="16" height="16"/>
    <use href="#sp" x="392" y="606" width="16" height="16"/>
  </g>

  <use href="#candle" transform="translate(166 506)"/>
  <use href="#candle" transform="translate(634 506)"/>

  <!-- cartas de trás -->
  <use href="#cardBack" transform="translate(276 554) rotate(-4)"/>
  <use href="#cardMoon" transform="translate(524 554) rotate(4)"/>

  <!-- bola de cristal -->
  <circle cx="400" cy="516" r="122" fill="url(#glow)" opacity=".55"/>
  <circle cx="400" cy="516" r="52" fill="url(#ball)"/>
  <ellipse cx="382" cy="494" rx="15" ry="10" fill="#fff" opacity=".7" transform="rotate(-30 382 494)"/>
  <use href="#sp" x="406" y="508" width="16" height="16" fill="#fff" opacity=".9"/>
  <use href="#sp" x="384" y="526" width="9" height="9" fill="#fff" opacity=".8"/>
  <path d="M368 560 H432 L446 586 H354Z" fill="url(#copper)"/>
  <path d="M354 586 H446" stroke="#7a3e1b" stroke-width="2"/>

  <!-- cartas da frente -->
  <use href="#cardSun" transform="translate(246 566) rotate(-16)"/>
  <use href="#cardLovers" transform="translate(554 566) rotate(16)"/>
</svg>
