<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Três cartas de tarô abertas sobre a mesa: O Sol, Os Enamorados e A Lua">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#2a4d85"/>
      <stop offset=".6" stop-color="#16294d"/>
      <stop offset="1" stop-color="#0b1530"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe0b0" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffe0b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6ea"/>
      <stop offset="1" stop-color="#f1dcbc"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9b47a"/>
      <stop offset="1" stop-color="#a8592a"/>
    </linearGradient>

    <path id="crescent" d="M8 -18.33 A20 20 0 1 0 8 18.33 A19.3 19.3 0 0 1 8 -18.33Z"/>
    <symbol id="sp" viewBox="-10 -10 20 20"><path d="M0 -10 Q1.5 -1.5 10 0 Q1.5 1.5 0 10 Q-1.5 1.5 -10 0 Q-1.5 -1.5 0 -10Z"/></symbol>

    <g id="cardBase">
      <rect x="-42" y="-66" width="84" height="132" rx="8" fill="url(#card)" stroke="#b8682f" stroke-width="2"/>
      <rect x="-35" y="-59" width="70" height="118" rx="5" fill="none" stroke="#b8682f" stroke-width=".8" opacity=".7"/>
    </g>
    <g id="cardSun">
      <use href="#cardBase"/>
      <text x="0" y="-38" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#7a3e1b">XIX</text>
      <circle cx="0" cy="2" r="13" fill="#e2a668"/>
      <path transform="translate(0 2)" d="M0 -18V-26M0 18V26M-18 0H-26M18 0H26M12.7 -12.7L18.4 -18.4M-12.7 12.7L-18.4 18.4M12.7 12.7L18.4 18.4M-12.7 -12.7L-18.4 -18.4" stroke="#e2a668" stroke-width="3" stroke-linecap="round"/>
      <text x="0" y="50" text-anchor="middle" font-family="Georgia,serif" font-size="8" letter-spacing="1" fill="#7a3e1b">O SOL</text>
    </g>
    <g id="cardLovers">
      <use href="#cardBase"/>
      <text x="0" y="-38" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#7a3e1b">VI</text>
      <path transform="translate(0 4)" d="M0 16 C-22 2 -20 -16 -8 -16 C-3 -16 0 -12 0 -9 C0 -12 3 -16 8 -16 C20 -16 22 2 0 16Z" fill="#a8455a"/>
      <use href="#sp" x="-24" y="-20" width="9" height="9" fill="#b8682f"/>
      <use href="#sp" x="15" y="18" width="9" height="9" fill="#b8682f"/>
      <text x="0" y="50" text-anchor="middle" font-family="Georgia,serif" font-size="7" letter-spacing=".6" fill="#7a3e1b">OS ENAMORADOS</text>
    </g>
    <g id="cardMoon">
      <use href="#cardBase"/>
      <text x="0" y="-38" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#7a3e1b">XVIII</text>
      <use href="#crescent" transform="translate(0 2)" fill="#36578c"/>
      <use href="#sp" x="10" y="-18" width="10" height="10" fill="#b8682f"/>
      <text x="0" y="50" text-anchor="middle" font-family="Georgia,serif" font-size="8" letter-spacing="1" fill="#7a3e1b">A LUA</text>
    </g>
    <g id="candle">
      <circle cx="0" cy="-74" r="38" fill="url(#glow)" opacity=".8"/>
      <rect x="-11" y="-58" width="22" height="58" rx="3" fill="#f4e6cf"/>
      <ellipse cx="0" cy="0" rx="20" ry="6" fill="url(#copper)"/>
      <path d="M0 -58 V-64" stroke="#3b2420" stroke-width="2"/>
      <path d="M0 -88 C8 -76 9 -68 0 -62 C-9 -68 -8 -76 0 -88Z" fill="#ffcf7a"/>
      <path d="M0 -78 C3 -72 3 -68 0 -65 C-3 -68 -3 -72 0 -78Z" fill="#fff3d6"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <g fill="#fff">
    <circle cx="70" cy="60" r="1.6" opacity=".7"/>
    <circle cx="180" cy="120" r="1.2" opacity=".5"/>
    <circle cx="640" cy="70" r="1.8" opacity=".7"/>
    <circle cx="730" cy="160" r="1.3" opacity=".6"/>
    <circle cx="120" cy="250" r="1.4" opacity=".55"/>
    <circle cx="690" cy="300" r="1.5" opacity=".6"/>
    <circle cx="300" cy="40" r="1.2" opacity=".5"/>
    <circle cx="520" cy="30" r="1.5" opacity=".6"/>
  </g>
  <circle cx="400" cy="250" r="230" fill="url(#glow)" opacity=".25"/>
  <circle cx="400" cy="250" r="185" fill="none" stroke="#e2a668" stroke-width="1.5" opacity=".35"/>
  <circle cx="400" cy="250" r="200" fill="none" stroke="#e2a668" stroke-width="1" opacity=".2" stroke-dasharray="2 8"/>

  <use href="#candle" transform="translate(96 444) scale(1.15)"/>
  <use href="#candle" transform="translate(704 444) scale(1.15)"/>

  <use href="#cardSun" transform="translate(252 268) rotate(-13) scale(1.7)"/>
  <use href="#cardMoon" transform="translate(548 268) rotate(13) scale(1.7)"/>
  <use href="#cardLovers" transform="translate(400 248) scale(1.8)"/>

  <g fill="#e2a668">
    <use href="#sp" x="140" y="150" width="22" height="22"/>
    <use href="#sp" x="640" y="190" width="18" height="18"/>
    <use href="#sp" x="384" y="16" width="20" height="20" opacity=".9"/>
    <use href="#sp" x="210" y="420" width="14" height="14" opacity=".8"/>
    <use href="#sp" x="580" y="440" width="16" height="16" opacity=".8"/>
  </g>
</svg>
